name: Develop CI

run-name: PR CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches-ignore:
      - main

permissions:
  contents: read

env:
  CARGO_HOME: /home/github-runner/cargo-cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: [self-hosted, catfood]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: cargo fmt
        id: scan
        continue-on-error: true
        run: cargo fmt --check 2>&1 | tee fmt-report.txt

      - name: File Linear ticket for failure
        if: steps.scan.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-linear-ticket.sh fmt fmt-report.txt

      - if: steps.scan.outcome == 'failure'
        run: exit 1

  clippy:
    name: clippy
    runs-on: [self-hosted, catfood]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: cargo clippy
        id: scan
        continue-on-error: true
        run: cargo clippy -- -D warnings 2>&1 | tee clippy-report.txt

      - name: File Linear ticket for failure
        if: steps.scan.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-linear-ticket.sh clippy clippy-report.txt

      - if: steps.scan.outcome == 'failure'
        run: exit 1

  test:
    name: test
    runs-on: [self-hosted, catfood]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: cargo test
        id: scan
        continue-on-error: true
        run: cargo test 2>&1 | tee test-report.txt

      - name: File Linear ticket for failure
        if: steps.scan.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-linear-ticket.sh test test-report.txt

      - if: steps.scan.outcome == 'failure'
        run: exit 1

  dead-code:
    name: dead-code
    runs-on: [self-hosted, catfood]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache cargo-machete binary
        uses: actions/cache@v4
        with:
          path: /home/github-runner/cargo-cache/bin/cargo-machete
          key: ${{ runner.os }}-cargo-machete-0.9.2

      - name: Install cargo-machete
        run: command -v cargo-machete || cargo install cargo-machete --locked --version 0.9.2

      - name: Run dead-code scan
        id: scan
        continue-on-error: true
        run: ./scripts/dead-code-scan.sh

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request'
        with:
          header: dead-code-scan
          path: dead-code-report.md

      - name: File Linear ticket for failure
        if: steps.scan.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-linear-ticket.sh dead-code dead-code-report.md

      - name: Fail if unused dependencies were found
        if: steps.scan.outcome == 'failure'
        run: exit 1

  vscode-extension:
    name: vscode-extension
    runs-on: [self-hosted, catfood]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm ci
        working-directory: editors/vscode
        run: npm ci

      - name: Typecheck
        working-directory: editors/vscode
        run: npm run typecheck

      - name: Compile
        working-directory: editors/vscode
        run: npm run compile

  slack-notification:
    runs-on: [self-hosted, catfood]
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - dead-code
      - vscode-extension
    steps:
      - name: Post a message in a channel
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2.1.1
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*GitHub Action build result*: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "GitHub Action build result: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
