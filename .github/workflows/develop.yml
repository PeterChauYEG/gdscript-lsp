name: Develop CI

run-name: PR CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches-ignore:
      - main

permissions:
  contents: read

env:
  CARGO_HOME: /home/github-runner/cargo-cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# gdscript-lsp is public, and GitHub does not allow a public repository's
# workflow to call a reusable workflow defined in a private repository
# (PeterChauYEG/labone-actions is private) - the call fails at dispatch
# time with a "workflow file issue" before any job is even created,
# regardless of the source repo's Actions access settings (security.yml
# already documents/works around this same constraint for its Trivy scan).
# The 2026-07-25 migration to `uses: labone-actions/.../develop-rust-ci.yml`
# and `uses: labone-actions/.../actionlint.yml` violated this, which is why
# every PR/push here got zero real CI checks from that date on. Reverted to
# inline job definitions (as before that migration) until labone-actions is
# made public or this repo goes private.

jobs:
  changes:
    name: changes
    runs-on: [self-hosted, catfood, catfood-minimal]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      vscode: ${{ steps.filter.outputs.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/**'
            vscode:
              - 'editors/vscode/**'

  fmt:
    name: fmt
    needs: changes
    runs-on: [self-hosted, catfood, catfood-rust]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: cargo fmt
        id: scan
        continue-on-error: true
        run: cargo fmt --check 2>&1 | tee fmt-report.txt

      - name: File Linear ticket for failure
        if: steps.scan.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-linear-ticket.sh fmt fmt-report.txt

      - if: steps.scan.outcome == 'failure'
        run: exit 1

  clippy:
    name: clippy
    needs: changes
    runs-on: [self-hosted, catfood, catfood-rust]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: cargo clippy
        id: scan
        continue-on-error: true
        run: cargo clippy -- -D warnings 2>&1 | tee clippy-report.txt

      - name: File Linear ticket for failure
        if: steps.scan.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-linear-ticket.sh clippy clippy-report.txt

      - if: steps.scan.outcome == 'failure'
        run: exit 1

  test:
    name: test
    needs: changes
    runs-on: [self-hosted, catfood, catfood-rust]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: cargo test
        id: scan
        continue-on-error: true
        run: cargo test 2>&1 | tee test-report.txt

      - name: File Linear ticket for failure
        if: steps.scan.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-linear-ticket.sh test test-report.txt

      - if: steps.scan.outcome == 'failure'
        run: exit 1

  dead-code:
    name: dead-code
    needs: changes
    runs-on: [self-hosted, catfood, catfood-rust]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache cargo-machete binary
        uses: actions/cache@v4
        with:
          path: /home/github-runner/cargo-cache/bin/cargo-machete
          key: ${{ runner.os }}-dead-code-cargo-machete-0.9.2

      - name: Install cargo-machete
        run: command -v cargo-machete || cargo install cargo-machete --locked --version 0.9.2

      - name: Run dead-code scan
        id: scan
        continue-on-error: true
        run: ./scripts/dead-code-scan.sh

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request'
        with:
          header: dead-code-scan
          path: dead-code-report.md

      - name: File Linear ticket for failure
        if: steps.scan.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-linear-ticket.sh dead-code dead-code-report.md

      - name: Fail if unused dependencies were found
        if: steps.scan.outcome == 'failure'
        run: exit 1

  vscode-extension:
    name: vscode-extension
    needs: changes
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ needs.changes.outputs.vscode == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm ci
        working-directory: editors/vscode
        run: npm ci

      - name: Typecheck
        working-directory: editors/vscode
        run: npm run typecheck

      - name: Compile
        working-directory: editors/vscode
        run: npm run compile

  required-checks:
    name: required-checks
    needs: [changes, fmt, clippy, test, dead-code, vscode-extension]
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  slack-notification:
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - dead-code
      - vscode-extension
    steps:
      - name: Post a message in a channel
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2.1.1
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*GitHub Action build result*: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "GitHub Action build result: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
