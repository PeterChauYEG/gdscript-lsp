# clippy::too_many_lines threshold (function-size gate). See LAB-898 / the
# "Duplicate-Code & File-Size CI Job" Linear doc. Exceptions/thresholds live
# here, not in the CI job, per that doc's convention. The lint itself is
# enabled in Cargo.toml's [workspace.lints.clippy] table (it's
# allow-by-default) and enforced by the existing `cargo clippy -- -D
# warnings` CI job.
too-many-lines-threshold = 100
